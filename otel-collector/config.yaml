# ─────────────────────────────────────────────────────────────────
# OpenTelemetry Collector — config para stack local
# Recibe traces/metrics/logs de la app Flask vía OTLP gRPC
# Exporta traces → Jaeger, metrics → Prometheus, logs → Loki
# ─────────────────────────────────────────────────────────────────

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  zpages:
    endpoint: "0.0.0.0:55679"

receivers:
  # Recibe telemetría de las apps (OTLP es el protocolo nativo de OTel)
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  # Scrape de Prometheus — recoge el /metrics de la Flask app
  prometheus:
    config:
      scrape_configs:
        - job_name: "flask-app"
          scrape_interval: 15s
          static_configs:
            - targets: ["flask-app:5000"]
          metrics_path: /metrics

        # Scrape de las propias métricas del Collector
        - job_name: "otel-collector"
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  # Envía en lotes — reduce el número de llamadas a los exportadores
  batch:
    timeout: 5s
    send_batch_size: 512

  # Evita OOM si los exportadores van lentos
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Añade atributos de entorno a todos los spans/métricas/logs
  resource:
    attributes:
      - key: "deployment.environment"
        value: "development"
        action: upsert
      - key: "collector.version"
        value: "0.96.0"
        action: insert

  # Filtra spans de health checks para no contaminar el trace view
  filter/no_health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/health/live"'
        - 'attributes["http.target"] == "/health/ready"'
        - 'attributes["http.target"] == "/metrics"'

exporters:
  # Traces → Jaeger (UI en http://localhost:16686)
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  # Metrics → Prometheus (scrapeado por Prometheus server en puerto 8889)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "otel"

  # Logs → Loki (UI via Grafana datasource)
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    default_labels_enabled:
      exporter: false
      job: true
    labels:
      attributes:
        service.name: "service_name"
        deployment.environment: "environment"

  # Debug — imprime telemetría en el log del collector (útil para dev)
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

service:
  extensions: [health_check, zpages]

  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, filter/no_health, resource, batch]
      exporters:  [otlp/jaeger, debug]

    metrics:
      receivers:  [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters:  [prometheus, debug]

    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [loki, debug]

  # Expone métricas del propio Collector en :8888
  telemetry:
    logs:
      level: "info"
    metrics:
      level: "detailed"
      address: "0.0.0.0:8888"
